
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tạo nội dung chuyển tiền</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      padding: 24px 18px;
      width: 100%;
      max-width: 420px;
      margin-top: 12px;
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .sub {
      text-align: center;
      color: #777;
      font-size: 0.85rem;
      margin-bottom: 22px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 0.95rem;
    }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      border: 2px solid #ddd;
      border-radius: 12px;
      -webkit-appearance: none;
      appearance: none;
      font-family: inherit;
    }
    input {
      text-transform: uppercase;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.45;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }
    .field {
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 50px;
    }
    .btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #f1f1f1;
      color: #333;
      margin-top: 10px;
      font-size: 0.95rem;
      min-height: 44px;
    }
    #ketqua {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #e8f8ef;
      border: 1px solid #a8e6c1;
      border-radius: 14px;
    }
    #ketqua.show {
      display: block;
    }
    .label-kq {
      font-size: 0.75rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    #noidung {
      font-size: 1.05rem;
      font-weight: 600;
      color: #111;
      line-height: 1.5;
      word-break: break-word;
      user-select: all;
      -webkit-user-select: all;
    }
    .btn-copy {
      margin-top: 12px;
      width: 100%;
      padding: 15px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      min-height: 50px;
    }
    .btn-copy.show {
      display: block;
    }
    .btn-copy.ok {
      background: #15803d;
    }
    .btn-copy:active {
      opacity: 0.9;
      transform: scale(0.98);
    }
    .huong-dan {
      margin-top: 16px;
      text-align: center;
      font-size: 0.8rem;
      color: #999;
      line-height: 1.4;
    }
    .hint-mau {
      font-size: 0.8rem;
      color: #888;
      margin-top: 6px;
      line-height: 1.35;
    }
    .hint-mau code {
      background: #f0f0f0;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Tạo nội dung chuyển tiền</h1>
    <p class="sub">Chỉnh mẫu + nhập mã lô → Sao chép</p>

    <!-- ========== PHẦN CHỈNH SỬA NỘI DUNG CỐ ĐỊNH ========== -->
    <div class="field">
      <label for="mau">✏️ Nội dung cố định (mẫu)</label>
      <textarea id="mau" rows="3">PHAM THI LIEN CHUYEN TIEN COC STK123456789 LO DAT {LO}</textarea>
      <p class="hint-mau">Ghi <code>{LO}</code> ở chỗ muốn ghép mã lô vào</p>
    </div>

    <!-- Mã lô -->
    <div class="field">
      <label for="lo">Mã lô đất</label>
      <input type="text" id="lo" placeholder="VD: LK03" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters">
    </div>

    <button class="btn" onclick="tao()">Tạo nội dung</button>
    <button class="btn btn-secondary" onclick="luuMau()">💾 Lưu mẫu này</button>

    <div id="ketqua">
      <div class="label-kq">Nội dung đã tạo</div>
      <div id="noidung"></div>
      <button class="btn-copy" id="btnCopy" onclick="saoChep()">📋 Sao chép</button>
    </div>

    <p class="huong-dan">Sửa mẫu ở trên → nhập mã lô → bấm Sao chép<br>rồi dán vào phần nội dung chuyển tiền</p>
  </div>

  <script>
    const KEY = "mau_noi_dung_chuyen_tien";
    const mauMacDinh = "PHAM THI LIEN CHUYEN TIEN COC STK123456789 LO DAT {LO}";

    // Khôi phục mẫu đã lưu
    (function () {
      const saved = localStorage.getItem(KEY);
      if (saved) {
        document.getElementById("mau").value = saved;
      }
    })();

    function tao() {
      const mau = document.getElementById("mau").value.trim() || mauMacDinh;
      const lo = document.getElementById("lo").value.trim().toUpperCase();
      const kq = document.getElementById("ketqua");
      const nd = document.getElementById("noidung");
      const btn = document.getElementById("btnCopy");

      if (!lo) {
        kq.className = "show";
        nd.textContent = "Vui lòng nhập mã lô";
        btn.className = "btn-copy";
        return;
      }

      let text = mau.replace(/\{LO\}/gi, lo);

      // Nếu quên ghi {LO} thì tự thêm mã lô ở cuối
      if (!/\{LO\}/i.test(mau)) {
        text = mau + " " + lo;
      }

      nd.textContent = text;
      kq.className = "show";
      btn.className = "btn-copy show";
      btn.textContent = "📋 Sao chép";
      btn.classList.remove("ok");
      window._text = text;
    }

    function luuMau() {
      const mau = document.getElementById("mau").value.trim();
      if (!mau) {
        alert("Mẫu đang trống!");
        return;
      }
      localStorage.setItem(KEY, mau);
      alert("Đã lưu mẫu! Lần sau mở trang sẽ dùng mẫu này.");
    }

    function saoChep() {
      if (!window._text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(window._text).then(hienDaChep).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const t = document.createElement("textarea");
      t.value = window._text;
      t.style.position = "fixed";
      t.style.left = "-9999px";
      document.body.appendChild(t);
      t.focus();
      t.select();
      try {
        document.execCommand("copy");
        hienDaChep();
      } catch (e) {
        alert("Không copy được. Hãy chọn chữ rồi copy thủ công.");
      }
      document.body.removeChild(t);
    }

    function hienDaChep() {
      const btn = document.getElementById("btnCopy");
      btn.textContent = "✅ Đã sao chép!";
      btn.classList.add("ok");
      setTimeout(() => {
        btn.textContent = "📋 Sao chép";
        btn.classList.remove("ok");
      }, 2000);
    }

    document.getElementById("lo").addEventListener("input", function () {
      clearTimeout(window._t);
      window._t = setTimeout(tao, 200);
    });

    document.getElementById("mau").addEventListener("input", function () {
      clearTimeout(window._t2);
      window._t2 = setTimeout(tao, 300);
    });

    document.getElementById("lo").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        tao();
        document.getElementById("lo").blur();
      }
    });
  </script>
</body>
</html>
