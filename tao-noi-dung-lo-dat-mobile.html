<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tạo nội dung chuyển tiền</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      padding: 28px 20px;
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.35rem;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: #777;
      font-size: 0.9rem;
      margin-bottom: 26px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
      font-size: 1rem;
    }
    input {
      width: 100%;
      padding: 16px 18px;
      font-size: 1.2rem;
      border: 2px solid #ddd;
      border-radius: 14px;
      text-transform: uppercase;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }
    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
    }
    .btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    #ketqua {
      display: none;
      margin-top: 24px;
      padding: 18px;
      background: #e8f8ef;
      border: 1px solid #a8e6c1;
      border-radius: 14px;
    }
    #ketqua.show {
      display: block;
    }

    .label-kq {
      font-size: 0.75rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    #noidung {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111;
      line-height: 1.55;
      word-break: break-word;
      user-select: all;
      -webkit-user-select: all;
    }
    .btn-copy {
      margin-top: 14px;
      width: 100%;
      padding: 16px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      min-height: 52px;
    }
    .btn-copy.show {
      display: block;
    }
    .btn-copy.ok {
      background: #15803d;
    }
    .btn-copy:active {
      opacity: 0.9;
      transform: scale(0.98);
    }
    .huong-dan {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #999;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Tạo nội dung chuyển tiền</h1>
    <p class="sub">Nhập mã lô → tự ghép câu → Sao chép</p>

    <label for="lo">Mã lô đất</label>
    <input type="text" id="lo" placeholder="VD: LK03" autofocus inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters">

    <button class="btn" onclick="tao()">Tạo nội dung</button>

    <div id="ketqua">
      <div class="label-kq">Nội dung đã tạo</div>
      <div id="noidung"></div>
      <button class="btn-copy" id="btnCopy" onclick="saoChep()">📋 Sao chép</button>
    </div>

    <p class="huong-dan">Gõ mã lô xong bấm Sao chép<br>rồi dán vào phần nội dung chuyển tiền</p>
  </div>

  <script>
    // ========== MẪU CÂU ==========
    // {LO} = mã lô bạn nhập
    const MAU = "PHAM THI LIEN CHUYEN TIEN COC STK123456789 LO DAT {LO}";

    function tao() {
      const lo = document.getElementById("lo").value.trim().toUpperCase();
      const kq = document.getElementById("ketqua");
      const nd = document.getElementById("noidung");
      const btn = document.getElementById("btnCopy");

      if (!lo) {
        kq.className = "show";
        nd.textContent = "Vui lòng nhập mã lô";
        btn.className = "btn-copy";
        return;
      }

      const text = MAU.replace("{LO}", lo);
      nd.textContent = text;
      kq.className = "show";
      btn.className = "btn-copy show";
      btn.textContent = "📋 Sao chép";
      btn.classList.remove("ok");
      window._text = text;
    }

    function saoChep() {
      if (!window._text) return;

      // Ưu tiên clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(window._text).then(hienDaChep).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const t = document.createElement("textarea");
      t.value = window._text;
      t.style.position = "fixed";
      t.style.left = "-9999px";
      document.body.appendChild(t);
      t.focus();
      t.select();
      try {
        document.execCommand("copy");
        hienDaChep();
      } catch (e) {
        alert("Không copy được. Hãy chọn chữ rồi copy thủ công.");
      }
      document.body.removeChild(t);
    }

    function hienDaChep() {
      const btn = document.getElementById("btnCopy");
      btn.textContent = "✅ Đã sao chép!";
      btn.classList.add("ok");
      setTimeout(() => {
        btn.textContent = "📋 Sao chép";
        btn.classList.remove("ok");
      }, 2000);
    }

    // Tự tạo khi gõ
    document.getElementById("lo").addEventListener("input", function () {
      clearTimeout(window._t);
      window._t = setTimeout(tao, 200);
    });

    // Enter
    document.getElementById("lo").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        tao();
        document.getElementById("lo").blur(); // ẩn bàn phím trên điện thoại
      }
    });
  </script>
</body>
</html>
